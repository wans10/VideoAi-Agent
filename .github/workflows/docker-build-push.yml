name: Build and Push Docker Images

on:
  push:
    branches:
      - main
      - feat/add-zh-i18n
      - feat/llmhub-pay
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push_latest:
        description: 'Tag as latest'
        required: true
        type: boolean
        default: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Support both variables (vars) and secrets, with fallback to repository owner
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'wans10' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/videoai-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/add-zh-i18n' || github.ref == 'refs/heads/feat/llmhub-pay' || inputs.push_latest }}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Extract Docker metadata for db-migrate
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/videoai-db-migrate
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/add-zh-i18n' || github.ref == 'refs/heads/feat/llmhub-pay' || inputs.push_latest }}
            type=ref,event=branch
            type=sha,prefix=,format=short
            type=ref,event=tag

      - name: Build and push db-migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE=/api
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://videoai.omninodetech.com' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://sbayxqlhqhjsripkktdx.supabase.co' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
