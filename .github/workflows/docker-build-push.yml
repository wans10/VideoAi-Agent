name: Build and Push Docker Images

on:
  # Both branches read this file from the pushed commit, so no default-branch copy is needed.
  # feat/white-label-keyvo publishes <sha>; sandbox/** publishes sandbox-<sha> test images only.
  push:
    branches: [feat/white-label-keyvo, "sandbox/**"]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Support both variables (vars) and secrets, with fallback to repository owner
      DOCKERHUB_USER: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || 'wans10' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate Keyvo build origin
        if: always()
        env:
          BUILD_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://app.keyvo.cn' }}
        run: |
          if [ "$BUILD_SITE_URL" != "https://app.keyvo.cn" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL must be https://app.keyvo.cn for the Keyvo image. Update the repository variable."
            exit 1
          fi

      - name: Verify required public authentication configuration
        env:
          BUILD_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          BUILD_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          test -n "$BUILD_SUPABASE_URL"
          test -n "$BUILD_SUPABASE_ANON_KEY"

      - name: Compute image tag
        id: tag
        run: |
          if [ "$GITHUB_REF_NAME" = "feat/white-label-keyvo" ]; then
            echo "value=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "value=sandbox-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata for Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/videoai-web
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Extract Docker metadata for db-migrate
        id: meta-migrate
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/videoai-db-migrate
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Extract Docker metadata for timeline worker
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USER }}/videoai-timeline-worker
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}

      - name: Build and push db-migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrations
          push: true
          tags: ${{ steps.meta-migrate.outputs.tags }}
          labels: ${{ steps.meta-migrate.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE=/api
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://app.keyvo.cn' }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
            NEXT_PUBLIC_GOOGLE_ANALYTICS_ID=${{ vars.NEXT_PUBLIC_GOOGLE_ANALYTICS_ID || '' }}
            NEXT_PUBLIC_CUSTOMER_CURRENCY=CNY
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push timeline worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.timeline-worker
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=timeline-worker
          cache-to: type=gha,mode=max,scope=timeline-worker

      - name: Verify published timeline worker runtime
        env:
          WORKER_IMAGE: ${{ env.DOCKERHUB_USER }}/videoai-timeline-worker:${{ steps.tag.outputs.value }}
        run: |
          docker pull "$WORKER_IMAGE"
          docker run --rm --entrypoint sh "$WORKER_IMAGE" -c 'node --version && chromium --version && ffmpeg -version && pnpm --version'
          # No credentials: startup must reach its database preflight, not fail
          # on a missing module, source path, package manager or browser.
          set +e
          docker run --rm "$WORKER_IMAGE" > worker-preflight.log 2>&1
          result=$?
          set -e
          cat worker-preflight.log
          test "$result" -ne 0
          grep -q 'TIMELINE_EXPORT_WORKER_DATABASE_NOT_CONFIGURED' worker-preflight.log
