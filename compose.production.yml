services:
  web:
    # Set IMAGE_TAG to an immutable Git SHA when rolling back. The default is
    # the latest image published from main.
    image: ${IMAGE_REPOSITORY:?Set IMAGE_REPOSITORY}:${IMAGE_TAG:-latest}
    env_file:
      - .env.production
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/api/health/env', { headers: { Authorization: 'Bearer ' + process.env.HEALTHCHECK_TOKEN } }).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
