name: maxvideoai

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maxvideoai}
      POSTGRES_USER: ${POSTGRES_USER:-maxvideoai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  db-migrate:
    build:
      context: .
      target: migrations
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-maxvideoai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-maxvideoai}}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]

  web:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_CUSTOMER_CURRENCY: ${NEXT_PUBLIC_CUSTOMER_CURRENCY:-CNY}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NEXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    env_file:
      # Copy .env.production.example before deployment. `required: false` keeps
      # `docker compose config` useful on a clean checkout.
      - path: .env.production
        required: false
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set a random CRON_SECRET}
      HEALTHCHECK_TOKEN: ${HEALTHCHECK_TOKEN:?Set a random HEALTHCHECK_TOKEN}
      STUDIO_VERCEL_WORKERS_ENABLED: "true"
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-maxvideoai}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-maxvideoai}}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health/db',{headers:{'x-healthcheck-token':process.env.HEALTHCHECK_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3000"
    networks: [backend]

  scheduler:
    image: node:22-bookworm-slim
    command: ["node", "/scheduler.mjs"]
    volumes:
      - ./docker/scripts/scheduler.mjs:/scheduler.mjs:ro
    environment:
      CRON_SECRET: ${CRON_SECRET:?Set a random CRON_SECRET}
      SCHEDULER_ORIGIN: http://web:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    networks: [backend]

  # Retained for fixture-driven development and offline testing only.
  mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    profiles: ["mock"]
    ports:
      - "3333:3333"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      HOST: ${HOST:-0.0.0.0}
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    driver: bridge
